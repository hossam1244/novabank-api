name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://novabank:novabank@localhost:5432/novabank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          coverage run -m pytest --tb=short
          coverage report
      - name: Publish coverage summary
        if: matrix.python-version == '3.12'
        run: |
          {
            echo "### Coverage"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUM" 2>/dev/null || true
          {
            echo '```'
          } >> "$GITHUB_STEP_SUM"
      - name: Upload coverage data
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t novabank-api:ci .
